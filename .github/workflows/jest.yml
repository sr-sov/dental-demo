name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node --version && npm --version
      - run: npm ci
      - if: failure()
        run: ls /home/runner/.npm/_logs/ && tail -n 150 /home/runner/.npm/_logs/*.log
      - run: npm test
